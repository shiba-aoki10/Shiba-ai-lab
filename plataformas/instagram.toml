# Cada limite registra status, fonte e data de consulta. Enquanto o status for
# "a_verificar", ultrapassar o limite gera só AVISO, nunca bloqueio.
# Para passar a "verificado", preencha fonte (URL da documentação oficial),
# consultado_em (AAAA-MM-DD) e verificado_por. O motor recusa "verificado" sem
# fonte e data.

id = "instagram"
nome = "Instagram"

[limites.legenda_max_caracteres]
valor = 2200
status = "a_verificar"
fonte = ""
consultado_em = ""
verificado_por = ""
