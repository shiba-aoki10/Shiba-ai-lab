# Temas de SAÚDE que exigem validação pelo responsável competente
# (Incremento 3D).
#
# IMPORTANTE:
# - Esta lista NÃO diz o que é permitido ou proibido. Ela só aponta temas
#   em que profissões e serviços de saúde costumam ter regras próprias, para
#   que uma pessoa habilitada (responsável técnico, jurídico ou de
#   conformidade do cliente) valide a peça.
# - Nenhuma norma é citada ou interpretada aqui. As referências aplicáveis
#   devem ser cadastradas pelo cliente em [normas], com fonte.
# - Ausência de termo da lista NÃO significa que a peça dispensa validação.
#
# Campos: termo ("*" no fim = prefixo; sem acento e sem maiúsculas), motivo.

