# Léxico editorial pt-BR do Shiba (Incremento 3A).
#
# NADA aqui é proibição. Cada entrada gera um ALERTA explicável (info ou
# aviso) para revisão humana. Uma expressão listada pode estar correta no
# contexto; quem decide é a pessoa que revisa.
#
# Categorias:
#   ia      expressões que aparecem com frequência em textos gerados por IA
#           (sozinhas são comuns; o alerta sobe para aviso quando se acumulam
#           no mesmo parágrafo, conforme [editorial] ia_por_paragrafo_aviso)
#   cliche  frases feitas que costumam enfraquecer o texto
#   muleta  palavras de apoio que raramente acrescentam sentido
#
# Campos: termo (com "*" no fim = prefixo), categoria, justificativa, sugestao,
# severidade opcional (info | aviso; padrão info).
# Comparação sem maiúsculas e sem acentos, por palavra ou expressão inteira.
# Fonte: curadoria editorial interna; NÃO é medição de detector de IA.

versao = 1

[stopwords]
# Palavras ignoradas na detecção de repetição.
