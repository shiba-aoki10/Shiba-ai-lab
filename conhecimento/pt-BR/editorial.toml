  "a", "o", "as", "os", "um", "uma", "uns", "umas", "de", "do", "da", "dos", "das",
  "em", "no", "na", "nos", "nas", "por", "pelo", "pela", "pelos", "pelas", "para", "pra",
  "com", "sem", "sob", "sobre", "entre", "ate", "apos", "desde", "contra", "e", "ou", "mas",
  "que", "se", "como", "quando", "onde", "porque", "pois", "porem", "entao", "tambem",
  "muito", "muita", "muitos", "muitas", "mais", "menos", "ja", "ainda", "so", "bem", "nao",
  "sim", "ser", "estar", "ter", "haver", "fazer", "foi", "era", "sao", "esta", "estao",
  "tem", "isso", "isto", "aquilo", "esse", "essa", "esses", "essas", "este", "esta",
  "estes", "estas", "aquele", "aquela", "seu", "sua", "seus", "suas", "meu", "minha",
  "nosso", "nossa", "nossos", "nossas", "voce", "voces", "ele", "ela", "eles", "elas",
  "nos", "eu", "lhe", "todo", "toda", "todos", "todas", "cada", "outro", "outra", "mesmo",
  "mesma", "aqui", "ali", "agora", "hoje", "sempre", "nunca", "pode", "podem", "vai", "vao",
]

